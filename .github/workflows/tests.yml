name: Tests
on: [push, pull_request]
jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96'
          targets: wasm32-unknown-unknown
      - name: Install contract build tooling
        run: cargo install cargo-near --version 0.21.1 --locked --no-default-features
      - name: Run tests
        run: cargo test --locked -- --test-threads=2
