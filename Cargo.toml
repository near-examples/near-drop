[package]
name = "near_drops"
version = "1.0.0"
authors = ["Guillermo Gallardo <guillermo@near.org>"]
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.29.1"
near-contract-standards = "5.29.1"
serde_json = "1.0.151"
# borsh = "1.5.3"

[dev-dependencies] 
near-sdk = { version = "5.29.1", features = ["unit-testing"] }
near-workspaces = { version = "0.23.0", features = ["unstable"] }
anyhow = "1.0"
tokio = { version = "1.53.1", features = ["full"] }
