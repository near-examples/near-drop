[package]
name = "near_drops"
version = "1.0.0"
authors = ["Guillermo Gallardo <guillermo@near.org>"]
edition = "2021"
autotests = false

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"
serde_json = "1.0.151"
# borsh = "1.5.3"

[dev-dependencies] 
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }
anyhow = "1.0"
tokio = { version = "1.53.1", features = ["full"] }
near-api = "0.8.6"
near-sandbox = "0.3"
cargo-near-build = "0.11.5"

[[test]]
name = "main"
path = "tests/main.rs"
